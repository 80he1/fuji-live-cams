name: live-ids
on:
  # schedule disabled: YouTube blocks GitHub runner IPs ("Sign in to confirm you're not a bot", 184/199 blocked on 2026-10-14).
  # The box runs tools/run_live.sh instead.
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: live-ids, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -U yt-dlp
      - run: python3 tools/check_live.py camidx.json live.json
      - name: commit if changed
        run: |
          git config user.name 80he1; git config user.email 80he1@users.noreply.github.com
          git add live.json
          git diff --cached --quiet || (git commit -qm "live.json auto-update" && git pull -q --rebase && git push -q)
