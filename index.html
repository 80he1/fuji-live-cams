<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gap:6px;
  --glass-fill:rgba(255,255,255,.14);--glass-fill-on:rgba(255,255,255,.28);
  --glass-line:rgba(255,255,255,.42);--glass-line-on:rgba(255,255,255,.9);
  --glass-solid:rgba(28,32,44,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#05070d;-webkit-text-size-adjust:100%;height:auto;overflow-y:auto}
body{min-height:100dvh;color:#fff;font:500 13px/1.3 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;height:auto;overflow:visible;touch-action:manipulation}
/* soft blurred Fuji backdrop so the glass has something to read against */
#bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:#05070d center/cover no-repeat;filter:blur(28px) saturate(1.3) brightness(.55);transform:scale(1.15)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.25),rgba(5,7,13,.7))}

/* ---------- glass primitive: small pills only ---------- */
.glass{
  background:var(--glass-solid);
  border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
  color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);
}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass-fill);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
  /* pills sitting on live video get a faint dark tint so white text stays legible on bright skies */
  .cam .glass,#modal .glass{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.10)),rgba(12,16,26,.30)}
}

/* ---------- top bar: transparent strip holding glass pills ---------- */
.tabs{touch-action:none;position:sticky;top:0;z-index:5;display:flex;align-items:stretch;isolation:isolate;overflow:hidden;padding:var(--sat) var(--sar) 0 var(--sal);
  background:transparent}
.tabs::before{display:none}
.tabs::after{display:none}
.tabs .title{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:17px;border-right:1px solid rgba(255,255,255,.08)}
.chips{position:relative;flex:1;min-width:0;display:flex;direction:ltr}
.lang{flex:none;width:44px;height:40px;border:0;margin:0;padding:0;background:transparent;opacity:.95;font-size:19px;cursor:pointer;-webkit-tap-highlight-color:transparent}

#tp button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;text-align:start;border-radius:10px;cursor:pointer}#tp button small{margin-inline-start:auto;opacity:.55;font-family:Inter,system-ui,sans-serif;font-size:11px}
#tp{position:fixed}#tp .tpc{position:absolute;left:4px;right:4px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);pointer-events:none;transition:top .22s cubic-bezier(.2,.8,.2,1)}#tp button{position:relative}#tp .tt{padding:6px 12px 4px;font-size:11px;opacity:.55}
#lp{position:fixed;z-index:30;top:calc(var(--sat) + 44px);right:calc(var(--sar) + 6px);max-height:calc(100dvh - var(--sat) - 60px);overflow:auto;border-radius:14px;padding:4px;min-width:190px;background:rgba(14,18,28,.72)}
#lp button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;text-align:start;border-radius:10px;cursor:pointer}
#lp button[aria-checked=true]{background:rgba(255,255,255,.12)}#lp hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:3px 6px}
.chip .tl{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#mapw{position:relative;width:var(--cw);aspect-ratio:1/1;touch-action:none;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#mapd{position:absolute;inset:0;background:#111}
#mapn,#mapl{z-index:500}

#modal.nofx{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.6)}

.mk.cam{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.3),0 1px 4px rgba(0,0,0,.6)}
.leaflet-control-zoom{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:none!important}

@media (orientation:landscape) and (max-height:540px){#mapw{display:none}}
.chip{letter-spacing:.02em;flex:1;min-width:0;height:40px;padding:0;margin:0;border:0;border-radius:0;background:transparent;color:rgba(255,255,255,.65);font-weight:600;position:relative;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.chip .tl,.chip small{position:relative;z-index:1}

/* ---------- grid ---------- */
#pager{position:relative;-webkit-mask-image:linear-gradient(transparent 0,#000 14px);mask-image:linear-gradient(transparent 0,#000 14px);overflow:hidden;touch-action:pan-y}html,body{overscroll-behavior:none;touch-action:pan-y;min-height:100dvh}
#ghost{position:absolute;left:0;top:0;width:100%;pointer-events:none;will-change:transform}

#grid{will-change:transform}
#grid{position:relative;overflow:hidden;width:100%}
.cam{position:absolute;overflow:hidden}
.cam .v{position:absolute;inset:0;overflow:hidden;background:#0b0e16;contain:layout paint}
.cam .v::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;z-index:4;pointer-events:none;background-color:rgb(var(--hz,255,255,255));-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.30) 0,rgba(0,0,0,.12) 8px,transparent 16px);mask-image:linear-gradient(to top,rgba(0,0,0,.30) 0,rgba(0,0,0,.12) 8px,transparent 16px);transition:background-color 1s}
.cam iframe{opacity:0;transition:opacity .8s ease}.cam iframe.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;height:35%;z-index:3;pointer-events:none;display:flex;align-items:flex-end;gap:5px;padding:0 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10.5px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.cap i{font-style:normal;font-weight:500;font-size:8.5px;opacity:.55;margin-left:5px;letter-spacing:.08em}
.cap b{flex:none;font-family:Inter,system-ui,sans-serif;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.92}.cap b:empty{display:none}
:root{--caph:0px}
.cam.hide{display:none}
.morewrap{display:flex;justify-content:center;padding:14px 0 6px}
body.expanded .morewrap,body.filtered .morewrap{display:none}
.more{height:48px;padding:0 24px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.cam iframe{position:absolute;left:50%;top:50%;border:0;width:calc(max(var(--w),var(--h)*16/9) + 2px);height:calc(max(var(--h),var(--w)*9/16) + 2px);transform:translate(-50%,-50%)}
.cam iframe{z-index:1;background:transparent;pointer-events:none}
.shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-y;transform:translateZ(0)}

.lb{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;max-width:calc(100% - 72px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 10px;border-radius:999px;font-size:11.5px;line-height:1.3}

.tsw{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);pointer-events:none}.tsw>*{pointer-events:auto}

#ts{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;width:min(100%,420px);font-size:11px}

/* ---------- fullscreen viewer ---------- */
#modal .glass{border:0;box-shadow:none}
#modal{position:fixed;inset:0;z-index:20;display:none;touch-action:none;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);

#modal.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}

#gs h2{font-size:17px;font-weight:700;margin:0 0 8px}#gs p{font-size:13px;line-height:1.65;color:rgba(255,255,255,.78);margin:0 0 10px}#gs p.pv{font-size:12px;color:rgba(190,220,255,.66)}
#gs ul{list-style:none;padding:0;margin:4px 0 16px;display:grid;gap:8px}#gs li{display:flex;gap:10px;align-items:center;font-size:13px}#gs li span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(120,190,255,.12);flex:none}#gs li.soon{opacity:.5}

#home #sfnr{position:relative}#home #sfnr .gst{display:flex;justify-content:center;align-items:center;gap:1px;margin:1px -4px 0;font-size:8px;line-height:1.25;color:rgba(150,205,255,.6);letter-spacing:-.02em}
#home #sfnr .gst span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#home #sfnr .gst::before{content:'';flex:none;width:0;height:5px;border-radius:50%;background:#7fe0a8;box-shadow:0 0 6px rgba(127,224,168,.8);opacity:0;transition:opacity .4s ease,width .4s ease,margin .4s ease}
#home #sfnr .gst.lv::before{width:5px;margin-right:2px;animation:gpl 2.4s ease-in-out infinite}@keyframes gpl{0%,100%{opacity:.35}50%{opacity:1}}

#home #sfnr .grf::before{content:'';position:absolute;inset:-12px -10px}
#home #sfnr::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(150,210,255,.20) 50%,transparent 80%);transform:translateX(-110%);opacity:0;pointer-events:none;transition:opacity .3s ease}
#home #sfnr.gld::after{opacity:1;animation:gsh 1.1s cubic-bezier(.4,0,.2,1) infinite}#home #sfnr.gld .grf{animation:gsp .9s linear infinite;color:#cfeaff}#home #sfnr.gld b,#home #sfnr.gld .nnm{opacity:.55;transition:opacity .3s ease}

#gs .ghe{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:linear-gradient(rgba(120,190,255,.10),rgba(120,190,255,.03))}#gs .ghe b{display:block;font-size:12px;font-weight:700;color:rgba(190,225,255,.85);margin-bottom:8px;letter-spacing:.02em}
#gs ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}#gs ol li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 3px;font-size:12.5px;line-height:1.4}
#gs ol li span{width:auto;height:auto;display:inline-block;flex:none;max-width:100%;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;white-space:normal}#gs ol li i{font-style:normal;color:rgba(160,210,255,.6);font-size:13px}
#gs details.gho{margin:0 0 14px}#gs details.gho summary{cursor:pointer;font-size:12.5px;color:rgba(190,225,255,.7);list-style:none;padding:4px 0 8px}#gs details.gho summary::-webkit-details-marker{display:none}#gs details.gho summary::after{content:' ⌄'}#gs details[open].gho summary::after{content:' ⌃'}
#gs .ghe+.ghe{margin-top:-4px}#gs .sh{max-height:86vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#gs a{display:block;text-align:center;margin-top:12px;font-size:11.5px;color:rgba(255,255,255,.45);text-decoration:none}
#gload{position:fixed;z-index:44;left:50%;top:calc(var(--sat) + 52px);transform:translateX(-50%);height:30px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:rgba(14,18,28,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s ease}#gload.on{opacity:1}
#sp{position:fixed;z-index:35;min-width:180px;padding:4px;border-radius:14px;background:rgba(14,18,28,.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);opacity:0;transition:opacity .22s ease}#sp.on{opacity:1}#sp[hidden]{display:none}#sp .tt{padding:6px 12px 4px;font-size:11px;opacity:.55}#sp button{display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#fff;font:inherit;font-size:13.5px;cursor:pointer}#sp button[aria-checked=true]{background:rgba(120,190,255,.16)}
#tp .tt .hsel,#sp button.hsel{background:rgba(255,255,255,.22)!important}
.mk.me{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#bfe6ff 0 35%,rgba(120,200,255,.55) 36% 60%,rgba(120,200,255,0) 61%);box-shadow:0 0 10px rgba(120,200,255,.6)}

#mact{width:var(--cw);display:flex;gap:6px;align-items:center;padding:8px 8px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(rgba(120,190,255,.07),rgba(120,190,255,.03)),rgba(10,14,24,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);touch-action:pan-x}#mact::-webkit-scrollbar{display:none}

#mact #mdist[hidden]{display:none}
#modal.open #card{border-radius:18px 18px 0 0}
#home{display:block!important;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0;background:radial-gradient(90% 45% at 50% 22%,rgba(40,90,160,.20),transparent 70%),radial-gradient(140% 80% at 50% 0%,#07101f 0%,#03050a 75%)}
#home[hidden]{display:none!important}
#home .sf1{min-height:100svh;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) calc(var(--sar) + 14px) calc(var(--sab) + 8px) calc(var(--sal) + 14px);box-sizing:border-box}
#home .sf2{padding:8px calc(var(--sar) + 14px) calc(var(--sab) + 18px) calc(var(--sal) + 14px)}
#home .stars{position:absolute;inset:0;height:100svh;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 78% 9%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 43% 31%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 91% 42%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 6% 55%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 64% 4%,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 27% 8%,rgba(255,255,255,.3),transparent)}

#home .globe{flex:1 1 230px;min-height:200px;max-height:330px;margin:0 -14px}
#home .globe canvas{position:absolute;inset:0;width:100%;height:100%}
#home .globe::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(150,210,255,.035) 0 1px,transparent 1px 3px);mask:radial-gradient(closest-side,#000 60%,transparent);-webkit-mask:radial-gradient(closest-side,#000 60%,transparent)}
#home .hc{position:absolute;font:500 9.5px/1.35 Inter,"Zen Kaku Gothic New",sans-serif;letter-spacing:.08em;color:rgba(160,215,255,.72);text-shadow:0 0 8px rgba(90,170,255,.5);max-width:46%}
#home .hc b{display:block;font:600 13px/1.25 Inter,"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;color:#e8f4ff;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .hc.tl{left:16px;top:6px}#home .hc.tr{right:16px;top:6px;text-align:right}#home .hc.bl{left:16px;bottom:6px}#home .hc.br{right:16px;bottom:6px;text-align:right}
#home .hud{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
#home .hud div{padding:6px 4px 5px;border-radius:12px;background:linear-gradient(rgba(120,190,255,.09),rgba(120,190,255,.02));text-align:center;font-size:9.5px;color:rgba(170,215,255,.65);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#home .hud button{all:unset;cursor:pointer;display:block;font-size:11px;color:#bfe4ff;line-height:1.2;padding-top:3px}
#home .tick{flex:none;height:20px;overflow:hidden;margin:0 -14px 8px;mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
#home .tick div{display:inline-flex;gap:22px;white-space:nowrap;font:500 11px/20px Inter,sans-serif;font-variant-numeric:tabular-nums;color:rgba(190,225,255,.78);letter-spacing:.06em;animation:sftk 48s linear infinite;padding-left:14px}

#home .tg{flex:none;max-height:none;grid-auto-rows:76px}#home .tg img{width:38px;flex:none}#home .tg button{gap:3px}

@keyframes sffd{50%{opacity:.35}}
#home .sh{font:600 10px Inter,sans-serif;letter-spacing:.24em;color:rgba(120,195,255,.7);margin:26px 2px 4px;text-shadow:0 0 10px rgba(90,170,255,.45)}

#home .fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#home .fc b{display:block;font-size:13.5px;margin:4px 0 4px;line-height:1.3}#home .fc p{margin:0;font-size:11px;line-height:1.5;color:rgba(220,235,255,.66)}

#home .gl b{display:block;font-size:12.5px;line-height:1.35}#home .gl small{display:block;font-size:10.5px;color:rgba(210,230,255,.6);line-height:1.4;margin-top:2px}
#home .rp{display:block;margin:12px auto 0;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:12.5px;color:#fff;background:linear-gradient(rgba(120,200,255,.25),rgba(120,200,255,.12));cursor:pointer}
#home .hero{margin-top:2px}

/* tutorial */
