*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ---------- glass primitive: small pills only ---------- */
.glass{

  .cam .glass,#modal .glass{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.10)),rgba(12,16,26,.30)}
}

.chips{position:relative;flex:1;min-width:0;display:flex}
.chip{flex:1;min-width:0;height:40px;padding:0;margin:0;border:0;border-radius:0;background:transparent;color:rgba(255,255,255,.62);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.chip+.chip{box-shadow:inset 1px 0 0 rgba(255,255,255,.08)}
.chip[aria-pressed=true]{color:#fff;background:rgba(255,255,255,.07)}
.chip small{font-size:10px;opacity:.6;margin-left:3px;font-weight:500}
#ind{position:absolute;left:0;bottom:0;height:2px;background:#fff;border-radius:2px 2px 0 0;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s;pointer-events:none}

:root{--caph:0px}

body.tiny .cap{padding:0 5px 3px;gap:3px;font-size:9.5px}body.tiny .cap i,body.tiny .lo{display:none}body.tiny .cap .nm{letter-spacing:0}

#modal{position:fixed;inset:0;z-index:20;display:none;touch-action:none;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);

#modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mcap .cap{font-size:12px;padding:0 12px 8px}
.mtop{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px}
.pill{height:30px;display:flex;align-items:center;padding:0 11px;border-radius:999px;font:inherit;font-size:12px;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}
#mx{width:30px;padding:0;justify-content:center}
</style>

function openM(t){
  if(closing)return;open=t;
  $('#mt').textContent=`${t.c.name}（${t.c.side}側）`;showMW();
  $('#mv').replaceChildren();t.mp=null;mkPlayer($('#mv'),t.c.id,p=>{if(open!==t){try{p.destroy()}catch(e){}return;}t.mp=p;});
  card.style.transform='';modal.classList.add('open');document.documentElement.style.overflow='hidden';
  card.animate([{transform:flipFrom(t),borderRadius:'0px'},{transform:'none',borderRadius:'18px'}],{duration:300,easing:FL});
  modal.animate([{backgroundColor:'rgba(0,0,0,0)'},{backgroundColor:'rgba(0,0,0,.45)'}],{duration:300,easing:'ease-out'});
  history.pushState({m:1},'');
}
function closeM(){
  if(!open||closing)return;const t=open;closing=true;
  const from=card.style.transform||'none';card.style.transform='';
  const an=card.animate([{transform:from,borderRadius:'18px'},{transform:flipFrom(t),borderRadius:'0px'}],{duration:260,easing:FL});
  modal.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-in'});
  const done=()=>{if(!closing)return;closing=false;try{t.mp&&t.mp.destroy()}catch(e){}t.mp=null;open=null;$('#mv').replaceChildren();
    modal.classList.remove('open');document.documentElement.style.overflow='';};
  an.onfinish=done;setTimeout(done,400);
}
const back=()=>{if(history.state&&history.state.m)history.back();else closeM();};
$('#mx').onclick=back;
addEventListener('popstate',closeM);
addEventListener('keydown',e=>{if(e.key==='Escape'&&open)back();});
/* swipe down to close (on the area around the video / the top bar) */
let sy=null,dy=0;
modal.addEventListener('click',e=>{if(e.target===modal||e.target.classList.contains('cred'))back();});
card.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('.mtop')){sy=e.touches[0].clientY;dy=0;}},{passive:true});
card.addEventListener('touchmove',e=>{if(sy===null)return;dy=Math.max(0,e.touches[0].clientY-sy);card.style.transform=`translateY(${dy}px) scale(${1-Math.min(dy/1500,.1)})`;},{passive:true});
card.addEventListener('touchend',()=>{if(sy===null)return;sy=null;if(dy>80)back();else{card.animate([{transform:card.style.transform},{transform:'none'}],{duration:220,easing:FL});card.style.transform='';}});

/* ---- finger-following pager: すべて → 北 → 南 → 東 → 西 ----
   Each live iframe exists once (moving/duplicating iframes would reload 21 streams), so the neighbour page
   is a lightweight ghost (thumbnails + captions) that slides in with the finger; on settle the real grid swaps in. */
const FS=sides.map(x=>x[0]);
let ghost=null,gDir=0;
function mkGhost(dir){
  if(ghost&&gDir===dir)return ghost; if(ghost)ghost.remove(); ghost=null;gDir=dir;
  const j=FS.indexOf(curF)+dir; if(j<0||j>=FS.length)return null;
  const f=FS[j],list=tiles.filter(t=>!f||t.c.side===f),L=layout(list.length);
  const g=document.createElement('div');g.id='ghost';g.className=L.tiny?'tinyg':'';g.style.height=L.H+'px';
  list.forEach((t,i)=>{const d=document.createElement('div');d.className='cam';place(d,L.rects[i]);
    d.innerHTML=`<div class="v" style="background:#0b0e16 url(https://i.ytimg.com/vi/${t.c.id}/mqdefault.jpg) center/cover"></div>`;
    d.firstChild.appendChild(t.el.querySelector('.cap').cloneNode(true));g.appendChild(d);});
  pager.appendChild(g);ghost=g;return g;}
const EASE='transform 280ms cubic-bezier(.2,.8,.2,1)';
function indAt(x,anim){const W=pager.clientWidth,bs=[...chips.querySelectorAll('.chip')],i=FS.indexOf(curF),a=bs[i],b=gDir?bs[i+gDir]:null;
  const f=b?Math.min(1,Math.max(0,Math.abs(x)/W)):0,L=a.offsetLeft+((b?b.offsetLeft:a.offsetLeft)-a.offsetLeft)*f,Wd=a.offsetWidth+((b?b.offsetWidth:a.offsetWidth)-a.offsetWidth)*f;
  ind.style.transition=anim?'transform 280ms cubic-bezier(.2,.8,.2,1),width 280ms cubic-bezier(.2,.8,.2,1)':'none';
  ind.style.transform=`translateX(${L}px)`;ind.style.width=Wd+'px';
  bs.forEach(c=>{c.style.transition=anim?'color 280ms,background 280ms':'none';c.style.color='';c.style.background='';});
  if(b){const k=v=>`rgba(255,255,255,${(.62+.38*v).toFixed(3)})`,g=v=>`rgba(255,255,255,${(.07*v).toFixed(3)})`;a.style.color=k(1-f);a.style.background=g(1-f);b.style.color=k(f);b.style.background=g(f);}
  return f;}
function setX(x,anim){const W=pager.clientWidth;indAt(x,anim);
  grid.style.transition=ghost&&anim?EASE:(anim?EASE:'none');grid.style.transform=x?`translate3d(${x}px,0,0)`:'';
  if(ghost){ghost.style.transition=anim?EASE:'none';ghost.style.transform=`translate3d(${x+gDir*W}px,0,0)`;}}
let busy=false;
function settle(commit){busy=true;const W=pager.clientWidth;
  setX(commit?-gDir*W:0,true);
  setTimeout(()=>{if(commit){const f=FS[FS.indexOf(curF)+gDir];filter(f,chips.querySelector(`.chip[data-f="${f}"]`),true);}
    grid.style.transition='none';grid.style.transform='';if(ghost){ghost.remove();ghost=null;}gDir=0;busy=false;chips.querySelectorAll('.chip').forEach(c=>{c.style.transition='none';c.style.color='';c.style.background='';});moveInd(true);},290);}
function goPage(j){if(busy||open)return;const i=FS.indexOf(curF);if(j===i)return;
  if(Math.abs(j-i)>1){filter(FS[j],chips.querySelector(`.chip[data-f="${FS[j]}"]`));return;}
  mkGhost(j>i?1:-1);setX(0,false);ghost&&ghost.offsetWidth;settle(true);}
let sx=0,py=0,lx=0,lt=0,vx=0,mode=0,swiped=0; // mode 0=undecided 1=horizontal -1=vertical
document.addEventListener('click',e=>{if(Date.now()-swiped<400){e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('touchstart',e=>{if(open||busy||e.touches.length!==1||e.target.closest('#chips,#modal')){mode=-1;return;}
  const t=e.touches[0];sx=lx=t.clientX;py=t.clientY;lt=e.timeStamp;vx=0;mode=0;},{passive:true});
document.addEventListener('touchmove',e=>{if(mode<0)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-py;
  if(mode===0){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;mode=Math.abs(dx)>1.5*Math.abs(dy)?1:-1;if(mode<0)return;}
  e.preventDefault();
  const dt=Math.max(1,e.timeStamp-lt);vx=.7*((t.clientX-lx)/dt)+.3*vx;lx=t.clientX;lt=e.timeStamp;
  const g=mkGhost(dx<0?1:-1);setX(g?dx:dx*.3,false);},{passive:false});
document.addEventListener('touchend',e=>{if(mode!==1)return;mode=0;swiped=Date.now();
  const dx=lx-sx,W=pager.clientWidth;
  const commit=!!ghost&&((Math.abs(vx)>.3&&Math.sign(vx)===-gDir)||Math.abs(dx)>.35*W)&&Math.sign(dx)===-gDir;
  settle(commit);},{passive:true});
document.addEventListener('touchcancel',()=>{if(mode===1){mode=0;settle(false);}},{passive:true});

/* ---- weather (Open-Meteo, keyless, one batched request, every 10 min; fails silently) ---- */
const WX=new Map();
const wIcon=(c,d=1)=>c===0?(d?'☀️':'🌙'):c<=2?(d?'🌤️':'☁️🌙'):c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
function showMW(){if(open){const c=open.el.querySelector('.cap').cloneNode(true);$('#mcap').replaceChildren(c);}const w=open&&WX.get(open);$('#mw').textContent=w?`${wIcon(w.weather_code,w.is_day)} ${Math.round(w.temperature_2m)}° ☁${w.cloud_cover}% 低${w.cloud_cover_low}% 💨${Math.round(w.wind_speed_10m)}km/h`:'';}
async function wx(){try{
  const q=tiles.filter(t=>t.c.lat!=null);
  const u='https://api.open-meteo.com/v1/forecast?latitude='+q.map(t=>t.c.lat).join(',')+'&longitude='+q.map(t=>t.c.lon).join(',')+
    '&current=is_day,temperature_2m,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m&timezone=Asia%2FTokyo';
  const r=await fetch(u);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
  q.forEach((t,i)=>{const w=j[i]&&j[i].current;if(!w)return;WX.set(t,w);
    t.el.querySelector('.wx').textContent=`${wIcon(w.weather_code,w.is_day)} ${Math.round(w.temperature_2m)}°`;});
  showMW();
}catch(e){}}
wx();setInterval(wx,600000);
</script>
