<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>富士山ライブカメラ</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://www.youtube.com">

<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gap:6px;
  --glass-fill:rgba(255,255,255,.14);--glass-fill-on:rgba(255,255,255,.28);
  --glass-line:rgba(255,255,255,.42);--glass-line-on:rgba(255,255,255,.9);
  --glass-solid:rgba(28,32,44,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#05070d;-webkit-text-size-adjust:100%;height:auto;overflow-y:auto}
body{min-height:100dvh;color:#fff;font:13px/1.3 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;height:auto;overflow:visible;touch-action:manipulation}
/* soft blurred Fuji backdrop so the glass has something to read against */
#bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:#05070d center/cover no-repeat;filter:blur(28px) saturate(1.3) brightness(.55);transform:scale(1.15)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.25),rgba(5,7,13,.7))}

/* ---------- glass primitive: small pills only ---------- */
.glass{
  background:var(--glass-solid);
  border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
  color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);
}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass-fill);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
  /* pills sitting on live video get a faint dark tint so white text stays legible on bright skies */
  .cam .glass,#modal .glass{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.10)),rgba(12,16,26,.30)}
}

/* ---------- top bar: transparent strip holding glass pills ---------- */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);
  background:linear-gradient(180deg,rgba(5,7,13,.55),rgba(5,7,13,0));pointer-events:none}
header>*{pointer-events:auto}
.title{flex:none;height:36px;display:flex;align-items:center;padding:0 14px;border-radius:999px;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:4px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:44px;height:44px;padding:0 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;scroll-snap-align:start;transition:background .2s,border-color .2s}
.chip[aria-pressed=true]{background:var(--glass-fill-on);border-color:var(--glass-line-on);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px rgba(255,255,255,.15),0 4px 16px rgba(0,0,0,.3)}
.chip small{font-size:11px;opacity:.75;margin-left:3px;font-weight:600}

/* ---------- grid ---------- */
#grid{display:grid;overflow-x:clip;gap:var(--gap);grid-template-columns:1fr;
  padding:2px calc(var(--sar) + var(--gap)) calc(var(--sab) + var(--gap)) calc(var(--sal) + var(--gap))}
@media (orientation:landscape) and (max-height:540px){#grid{grid-template-columns:repeat(2,1fr)} :root{--gap:5px}}
@media (min-width:700px) and (min-height:541px){#grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){#grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1600px){#grid{grid-template-columns:repeat(4,1fr)}}
.cam{position:relative;min-width:0}
.cam .v{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b0e16;contain:layout paint;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.cap{height:var(--caph);line-height:var(--caph);font-size:11px;color:rgba(255,255,255,.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cap i{font-style:normal;opacity:.55;margin-left:4px;font-size:10px}.cap{display:flex;gap:4px}.cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.cap b{flex:none;font-weight:400}.cap b:empty{display:none}
:root{--caph:15px}
.cam.hide{display:none}
.morewrap{display:flex;justify-content:center;padding:14px 0 6px}
body.expanded .morewrap,body.filtered .morewrap{display:none}
.more{height:48px;padding:0 24px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.cam iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.cam iframe{z-index:1;background:transparent;pointer-events:none}
.shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-x pan-y;transform:translateZ(0)}
#modal .shield{touch-action:none}
.lb{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;max-width:calc(100% - 72px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 10px;border-radius:999px;font-size:11.5px;line-height:1.3}
.lb i{font-style:normal;font-weight:600;opacity:.7;margin-left:5px;font-size:10.5px}
.ex{position:absolute;right:6px;top:6px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.ex svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;fill:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
footer{padding:8px calc(var(--sar) + 10px) calc(var(--sab) + 12px) calc(var(--sal) + 10px);text-align:center;font-size:10px;color:rgba(255,255,255,.4)}
body.tiny .lb{left:3px;top:3px;padding:2px 6px;font-size:9px}body.tiny .lb i{display:none}body.tiny .ex{display:none}.cam{cursor:pointer}

#modal .mw{height:36px;display:flex;align-items:center;padding:0 12px;border-radius:999px;font-size:13px;white-space:nowrap;margin-left:auto}
#modal .mw:empty{display:none}
.tsw{display:flex;justify-content:center;padding:6px calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px)}
#ts{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;width:min(100%,420px);font-size:11px}
#ts input{flex:1;min-width:0;accent-color:#fff;height:18px;margin:0}
#tsl{flex:none;min-width:84px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lo{flex:none;font-style:normal;font-size:9px;opacity:.6;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 3px;line-height:13px;align-self:center}
footer a{color:rgba(255,255,255,.55)}

/* ---------- fullscreen viewer ---------- */
#modal{position:fixed;inset:0;z-index:20;background:#000;display:none;touch-action:none;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);transition:transform .2s ease,opacity .2s}
#modal.open{display:flex;align-items:center;justify-content:center}
#modal .vw{position:relative;width:100%;max-width:calc((100dvh - var(--sat) - var(--sab)) * 16 / 9);aspect-ratio:16/9}
#mv{position:absolute;inset:0}
#modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#modal .bar{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) 10px calc(var(--sal) + 10px);pointer-events:none}
#modal .bar>*{pointer-events:auto}
#modal .mt{height:36px;display:flex;align-items:center;padding:0 14px;border-radius:999px;font-size:13px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .x{width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center}
#modal .grab{position:absolute;left:50%;bottom:calc(var(--sab) + 10px);width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(255,255,255,.35)}
@media (orientation:landscape) and (max-height:540px){#modal .bar{opacity:.85} #modal .grab{display:none}}
</style>
</head>
<body>
<div id="bg"></div>
<header>
  <div class="title glass">🗻 富士山ライブ</div>
  <nav class="chips" id="chips" aria-label="方角で絞り込み"></nav>
</header>
<div class="tsw"><div id="ts" class="glass"><span>⏪</span><input id="tsr" type="range" min="0" max="720" step="10" value="0" aria-label="時間をさかのぼる"><span id="tsl">ライブ</span></div></div>
<main id="grid"></main>
<footer>映像: 各YouTubeライブ配信者 ／ 一覧の出典: <a href="https://isfujivisible.com/ja/mt-fuji-live-cams" target="_blank" rel="noopener">isfujivisible.com</a></footer>

<div id="modal" role="dialog" aria-modal="true">
  <div class="bar"><div class="mt glass" id="mt"></div><div class="mw glass" id="mw"></div><button class="x glass" id="mx" aria-label="閉じる">✕</button></div>
  <div class="vw"><div id="mv"></div><div class="shield"></div></div>
  <div class="grab"></div>
</div>

<script>
const CAMS=[{"id": "gxcQJ8pJF0c", "name": "ふもとっぱら", "side": "南", "viewers": 139, "subs": 31600, "fuji": "見える", "top": true, "lat": 35.42, "lon": 138.579}, {"id": "GsD9QQEKSzQ", "name": "広重の富士山（さった峠）", "side": "南", "viewers": 104, "subs": 52400, "fuji": "見える（薄霞）", "top": true, "lat": 35.079, "lon": 138.556}, {"id": "bdUbACCWmoY", "name": "河口湖・大石公園", "side": "北", "viewers": 72, "subs": 45200, "fuji": "見える（薄霞）", "top": true, "lat": 35.526, "lon": 138.738}, {"id": "maMMEh-2Bsk", "name": "芦ノ湖（大観山）", "side": "東", "viewers": 14, "subs": 9680, "fuji": "見える", "top": true, "lat": 35.195, "lon": 139.075}, {"id": "1cnReFAU04k", "name": "河口湖畔", "side": "北", "viewers": 31, "subs": 45200, "fuji": "見える（裾に雲）", "top": false, "lat": 35.511, "lon": 138.757}, {"id": "F2NbYrc-gBU", "name": "山中湖畔", "side": "北", "viewers": 21, "subs": 45200, "fuji": "見える", "top": false, "lat": 35.41, "lon": 138.866}, {"id": "Joer2U0vki4", "name": "ぐりんぱ・二合目", "side": "南", "viewers": 13, "subs": 67700, "fuji": "見える", "top": false, "lat": 35.276, "lon": 138.77}, {"id": "rZckj5mmeXc", "name": "七面山 カメラ1", "side": "西", "viewers": 13, "subs": 10200, "fuji": "見える（薄霞）", "top": false, "lat": 35.37, "lon": 138.35}, {"id": "pPW9tqTL0BU", "name": "日本平", "side": "南", "viewers": 7, "subs": 151000, "fuji": "見える（薄霞）", "top": false, "lat": 34.97, "lon": 138.466}, {"id": "4Hro9QIrsYA", "name": "十国峠", "side": "東", "viewers": 6, "subs": 67700, "fuji": "見える", "top": false, "lat": 35.146, "lon": 139.048}, {"id": "_qdu714QT1E", "name": "本栖湖", "side": "北", "viewers": 6, "subs": 29600, "fuji": "見える", "top": false, "lat": 35.468, "lon": 138.59}, {"id": "ViHMZfmURiw", "name": "富士市 4K", "side": "南", "viewers": 6, "subs": 17500, "fuji": "見える", "top": false, "lat": 35.161, "lon": 138.676}, {"id": "so_3HK9HIdg", "name": "精進湖", "side": "北", "viewers": 5, "subs": 45200, "fuji": "見える", "top": false, "lat": 35.485, "lon": 138.617}, {"id": "_6nLps25Kws", "name": "FUJIYAMAタワー", "side": "北", "viewers": 3, "subs": 67700, "fuji": "見える（雲が多め）", "top": false, "lat": 35.487, "lon": 138.779}, {"id": "tuNC0ot0j9I", "name": "葉山海岸", "side": "東", "viewers": 3, "subs": 45200, "fuji": "霞で薄い", "top": false, "lat": 35.261, "lon": 139.574}, {"id": "MHEcWrKRKh8", "name": "神奈川から見る富士山", "side": "東", "viewers": 2, "subs": 226000, "fuji": "見える", "top": false, "lat": 35.45, "lon": 139.63}, {"id": "rBwmWq48zAs", "name": "御殿場", "side": "南", "viewers": 2, "subs": 41100, "fuji": "見える", "top": false, "lat": 35.308, "lon": 138.935}, {"id": "nl4UcsGSz-s", "name": "忠霊塔", "side": "北", "viewers": 2, "subs": 3970, "fuji": "見える", "top": false, "lat": 35.503, "lon": 138.801}, {"id": "WjVH-0qSwOw", "name": "山中湖・芙蓉台", "side": "北", "viewers": 2, "subs": 1510, "fuji": "見える", "top": false, "lat": 35.433, "lon": 138.858}, {"id": "OEPdIuE2ZpU", "name": "七面山 カメラ3", "side": "西", "viewers": 1, "subs": 10200, "fuji": "見える", "top": false, "lat": 35.37, "lon": 138.35}, {"id": "nh0TUmU-Sko", "name": "忍野しのびの里", "side": "北", "viewers": 1, "subs": 67700, "fuji": "山頂付近に雲", "top": false, "lat": 35.459, "lon": 138.853}];
const $=s=>document.querySelector(s);
const grid=$('#grid'),modal=$('#modal');
const phone=()=>Math.min(innerWidth,innerHeight)<600;
const embed=(id,x='')=>`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&cc_load_policy=0${x}`;
const ICON_EX='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';

$('#bg').style.backgroundImage=`url(https://i.ytimg.com/vi/${CAMS[0].id}/hqdefault.jpg)`;

/* ---- chips ---- */
const sides=[['','すべて'],['北','北'],['南','南'],['東','東'],['西','西']];
const chips=$('#chips');
sides.forEach(([f,l])=>{const n=f?CAMS.filter(c=>c.side===f).length:CAMS.length;
  const b=document.createElement('button');b.className='chip glass';b.dataset.f=f;b.setAttribute('aria-pressed',f===''?'true':'false');
  b.innerHTML=`${l}<small>${n}</small>`;b.onclick=()=>filter(f,b);chips.appendChild(b);});

/* ---- tiles: every cam streams continuously; iframes are added once and never removed or paused ---- */
const tiles=CAMS.map((c,i)=>{
  const d=document.createElement('div');d.className='cam'+(c.top?'':' rest');d.dataset.side=c.side;
  d.innerHTML=`<div class="v"><div class="shield"></div></div><div class="cap"><span class="nm">${c.name}<i>${c.side}</i></span><em class="lo" hidden>ライブのみ</em><b class="wx"></b></div>`;
  const t={c,el:d,v:d.querySelector('.v'),frame:null};d.setAttribute('role','button');d.setAttribute('aria-label',c.name+'を全画面');
  d.onclick=()=>openM(t);
  grid.appendChild(d);return t;});
const byEl=new Map(tiles.map(t=>[t.el,t]));
/* YouTube IFrame Player API: players are created once and never paused */
const PV={autoplay:1,mute:1,playsinline:1,controls:0,modestbranding:1,rel:0,iv_load_policy:3,disablekb:1,fs:0,cc_load_policy:0,enablejsapi:1,origin:location.origin};
let ytOK=false;const ytQ=[];
window.onYouTubeIframeAPIReady=()=>{ytOK=true;ytQ.splice(0).forEach(f=>f());};
{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);}
const whenYT=f=>ytOK?f():ytQ.push(f);
function mkPlayer(host,id,onReady){const d=document.createElement('div');host.prepend(d);
  return new Promise(res=>whenYT(()=>{const p=new YT.Player(d,{videoId:id,playerVars:PV,
    events:{onReady:e=>{try{e.target.mute();e.target.playVideo();}catch(_){}
      const f=e.target.getIframe();f.setAttribute('playsinline','');f.tabIndex=-1;onReady&&onReady(e.target);res(p);}}});}));}
function load(t){if(t.frame)return;t.frame=1;
  mkPlayer(t.v,t.c.id,p=>{t.p=p;setTimeout(()=>seekP(p,t),1500);setTimeout(()=>seekP(p,t,1),8000);});}
/* time shift: offset in seconds back from each player's live edge (getDuration), clamped to its DVR window */
let OFF=0;
function seekP(p,t,mark){try{const d=p.getDuration()||0;
  const live=d<120; if(t&&(mark||!live))t.el.querySelector('.lo').hidden=!live;
  if(live||!OFF){p.seekTo(d||0,true);p.playVideo();return;}
  p.seekTo(Math.max(0,d-OFF),true);p.playVideo();}catch(e){}}
const tsr=$('#tsr'),tsl=$('#tsl');
function tsLabel(){const m=+tsr.value;if(!m){tsl.textContent='ライブ';return;}
  const at=new Date(Date.now()-m*60000).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
  const h=Math.floor(m/60),mm=m%60;tsl.textContent=`${h?h+'時間':''}${mm?mm+'分':''}前 ${at}`;}
tsr.addEventListener('input',tsLabel);
tsr.addEventListener('change',()=>{OFF=+tsr.value*60;tsLabel();tiles.forEach(t=>t.p&&seekP(t.p,t));if(open&&open.mp)seekP(open.mp);});
setInterval(tsLabel,30000);
/* first screen starts immediately; the rest join as they come within ~1.5 screens, then stay running */
const near=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){load(byEl.get(e.target));near.unobserve(e.target);}}),{rootMargin:'300% 0px'});
tiles.forEach(t=>near.observe(t.el));
let curF='';
function filter(f,btn){
  curF=f;
  chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));
  btn.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
  tiles.forEach(t=>t.el.classList.toggle('hide',!!f&&t.c.side!==f));
  document.body.classList.toggle('filtered',!!f);
  scrollTo({top:0});fit();
}
/* first view = a few popular spots; the rest appear (and start streaming as they near the screen) after "もっと見る" */
/* fit every visible cam on one screen: pick the column count that gives the biggest 16:9 tiles */
function fit(){
  const vis=tiles.filter(t=>!t.el.classList.contains('hide')).length||1;
  const ch=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--caph'))||15;
  const g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||6;
  const W=grid.clientWidth-parseFloat(getComputedStyle(grid).paddingLeft)-parseFloat(getComputedStyle(grid).paddingRight);
  const H=innerHeight-document.querySelector('header').offsetHeight-document.querySelector('.tsw').offsetHeight-document.querySelector('footer').offsetHeight-8;
  let best=1,bw=0;
  for(let c=1;c<=vis;c++){const r=Math.ceil(vis/c);
    const w=Math.min((W-g*(c-1))/c,((H-g*(r-1))/r-ch)*16/9);if(w>bw){bw=w;best=c;}}
  grid.style.gridTemplateColumns=`repeat(${best},${Math.floor(bw)}px)`;
  grid.style.justifyContent='center';
  document.documentElement.style.setProperty('--lbs',bw<160?'none':'');
  document.body.classList.toggle('tiny',bw<170);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));fit();

/* ---- fullscreen viewer ---- */
let open=null;
function openM(t){
  open=t;
  $('#mt').textContent=`${t.c.name}（${t.c.side}側）`;showMW();
  $('#mv').replaceChildren();t.mp=null;mkPlayer($('#mv'),t.c.id,p=>{if(open!==t){try{p.destroy()}catch(e){}return;}t.mp=p;setTimeout(()=>seekP(p),1500);});
  modal.style.transform='';modal.style.opacity='';modal.classList.add('open');document.documentElement.style.overflow='hidden';
  history.pushState({m:1},'');
  // Android Chrome: real fullscreen + try landscape. iOS Safari ignores this and keeps the fixed overlay.
  if(phone()&&modal.requestFullscreen){modal.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}
}
function closeM(){
  if(!open)return;try{open.mp&&open.mp.destroy()}catch(e){}open.mp=null;open=null;$('#mv').replaceChildren();modal.classList.remove('open');document.documentElement.style.overflow='';
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  try{screen.orientation.unlock()}catch(e){}
}
const back=()=>{if(history.state&&history.state.m)history.back();else closeM();};
$('#mx').onclick=back;
addEventListener('popstate',closeM);
addEventListener('keydown',e=>{if(e.key==='Escape'&&open)back();});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&open&&phone())back();});
/* swipe down to close (on the area around the video / the top bar) */
let sy=null,dy=0;
modal.addEventListener('touchstart',e=>{if(e.touches.length===1){sy=e.touches[0].clientY;dy=0;modal.style.transition='none';}},{passive:true});
modal.addEventListener('touchmove',e=>{if(sy===null)return;dy=Math.max(0,e.touches[0].clientY-sy);modal.style.transform=`translateY(${dy}px)`;modal.style.opacity=String(1-Math.min(dy/500,.6));},{passive:true});
modal.addEventListener('touchend',()=>{if(sy===null)return;modal.style.transition='';if(dy>90)back();else{modal.style.transform='';modal.style.opacity='';}sy=null;});

/* ---- weather (Open-Meteo, keyless, one batched request, every 10 min; fails silently) ---- */
const WX=new Map();
const wIcon=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
function showMW(){const w=open&&WX.get(open);$('#mw').textContent=w?`${wIcon(w.weather_code)} ${Math.round(w.temperature_2m)}° ☁${w.cloud_cover}% 低${w.cloud_cover_low}% 💨${Math.round(w.wind_speed_10m)}km/h`:'';}
async function wx(){try{
  const q=tiles.filter(t=>t.c.lat!=null);
  const u='https://api.open-meteo.com/v1/forecast?latitude='+q.map(t=>t.c.lat).join(',')+'&longitude='+q.map(t=>t.c.lon).join(',')+
    '&current=temperature_2m,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m&timezone=Asia%2FTokyo';
  const r=await fetch(u);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
  q.forEach((t,i)=>{const w=j[i]&&j[i].current;if(!w)return;WX.set(t,w);
    t.el.querySelector('.wx').textContent=`${wIcon(w.weather_code)} ${Math.round(w.temperature_2m)}°`;});
  showMW();
}catch(e){}}
wx();setInterval(wx,600000);
</script>
