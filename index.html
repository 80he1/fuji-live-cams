<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gap:6px;
  --glass-fill:rgba(255,255,255,.14);--glass-fill-on:rgba(255,255,255,.28);
  --glass-line:rgba(255,255,255,.42);--glass-line-on:rgba(255,255,255,.9);
  --glass-solid:rgba(28,32,44,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#05070d;-webkit-text-size-adjust:100%;height:auto;overflow-y:auto}
body{min-height:100dvh;color:#fff;font:500 13px/1.3 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;height:auto;overflow:visible;touch-action:manipulation}
/* soft blurred Fuji backdrop so the glass has something to read against */
#bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:#05070d center/cover no-repeat;filter:blur(28px) saturate(1.3) brightness(.55);transform:scale(1.15)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.25),rgba(5,7,13,.7))}

/* ---------- glass primitive: small pills only ---------- */
.glass{
  background:var(--glass-solid);
  border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
  color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);
}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass-fill);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
  /* pills sitting on live video get a faint dark tint so white text stays legible on bright skies */
  .cam .glass,#modal .glass{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.10)),rgba(12,16,26,.30)}
}

/* ---------- top bar: transparent strip holding glass pills ---------- */
.tabs{position:sticky;top:0;z-index:5;display:flex;align-items:stretch;isolation:isolate;overflow:hidden;padding:var(--sat) var(--sar) 0 var(--sal);
  background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.12)}
.tabs::before{content:'';position:absolute;inset:-30px;z-index:-1;background:var(--tbg,#0a0d15) center 30%/cover;filter:blur(22px) saturate(1.5) brightness(.55);transform:translateZ(0)}
.tabs::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}
.tabs .title{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:17px;border-right:1px solid rgba(255,255,255,.08)}
.chips{position:relative;flex:1;min-width:0;display:flex;direction:ltr}
.lang{flex:none;width:44px;height:40px;border:0;margin:0;padding:0;background:transparent;opacity:.95;font-size:19px;cursor:pointer;box-shadow:inset 1px 0 0 rgba(255,255,255,.08);-webkit-tap-highlight-color:transparent}
#lp{position:fixed;z-index:30;top:calc(var(--sat) + 44px);right:calc(var(--sar) + 6px);max-height:calc(100dvh - var(--sat) - 60px);overflow:auto;border-radius:14px;padding:4px;min-width:190px;background:rgba(14,18,28,.72)}
#lp button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;text-align:start;border-radius:10px;cursor:pointer}
#lp button[aria-checked=true]{background:rgba(255,255,255,.12)}#lp hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:3px 6px}
.chip .tl{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#mapw{position:relative;width:var(--cw);aspect-ratio:1/1;touch-action:none;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#mapd{position:absolute;inset:0;background:#111}
#mapn,#mapl{z-index:500}
.leaflet-container{font:inherit;background:#111}
.sp{width:16px;height:16px;border-radius:50%;background:#ff5a1f;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.6)}
.spl{position:absolute;left:22px;top:-1px;white-space:nowrap;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000}
#modal.nofx{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.6)}
#mapd .leaflet-map-pane{will-change:transform}#mapd .leaflet-tile{will-change:transform;backface-visibility:hidden}
.mk.cam{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.3),0 1px 4px rgba(0,0,0,.6)}
.leaflet-control-zoom{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:rgba(14,18,28,.55)!important;color:#fff!important;border-color:rgba(255,255,255,.15)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.leaflet-control-attribution{font-size:8px!important;background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.7)!important}.leaflet-control-attribution a{color:#fff!important}
#mapn{position:absolute;left:8px;bottom:8px;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
#mapl{position:absolute;right:8px;top:8px;height:28px;font-size:11.5px}
@media (orientation:landscape) and (max-height:540px){#mapw{display:none}}
.chip{letter-spacing:.02em;flex:1;min-width:0;height:40px;padding:0;margin:0;border:0;border-radius:0;background:transparent;color:rgba(255,255,255,.7);position:relative;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.chip+.chip{box-shadow:inset 1px 0 0 rgba(255,255,255,.08)}
.chip .tl,.chip small{position:relative;z-index:1}
.chip[aria-pressed=true]{color:#fff;font-weight:700}
.chip small{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10px;opacity:.6;margin-left:3px;font-weight:500}
#ind{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) 4px 5px/calc(100% - 8px) calc(100% - 10px) no-repeat,linear-gradient(#fff,#fff) 50% 100%/60% 2px no-repeat;border-radius:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s;pointer-events:none}

/* ---------- grid ---------- */
#pager{position:relative;overflow:hidden;touch-action:pan-y}html,body{overscroll-behavior:none;touch-action:pan-y;min-height:100dvh}
#ghost{position:absolute;left:0;top:0;width:100%;pointer-events:none;will-change:transform}
#ghost.tinyg .cap{padding:0 5px 3px;gap:3px;font-size:9.5px}#ghost.tinyg .cap i{display:none}
#grid{will-change:transform}
#grid{position:relative;overflow:hidden;width:100%}
.cam{position:absolute;overflow:hidden}
.cam .v{position:absolute;inset:0;overflow:hidden;background:#0b0e16;contain:layout paint}
.cam .v::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 6px 1px rgba(255,255,255,.2),inset 0 0 1px rgba(255,255,255,.28)}
.cam iframe{opacity:0;transition:opacity .8s ease}.cam iframe.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;height:35%;z-index:3;pointer-events:none;display:flex;align-items:flex-end;gap:5px;padding:0 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10.5px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.cap i{font-style:normal;font-weight:500;font-size:8.5px;opacity:.55;margin-left:5px;letter-spacing:.08em}
.cap b{flex:none;font-family:Inter,system-ui,sans-serif;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.92}.cap b:empty{display:none}
:root{--caph:0px}
.cam.hide{display:none}
.morewrap{display:flex;justify-content:center;padding:14px 0 6px}
body.expanded .morewrap,body.filtered .morewrap{display:none}
.more{height:48px;padding:0 24px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.cam iframe{position:absolute;left:50%;top:50%;border:0;width:calc(max(var(--w),var(--h)*16/9) + 2px);height:calc(max(var(--h),var(--w)*9/16) + 2px);transform:translate(-50%,-50%)}
.cam iframe{z-index:1;background:transparent;pointer-events:none}
.shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-y;transform:translateZ(0)}
#modal .shield{touch-action:none}
.lb{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;max-width:calc(100% - 72px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 10px;border-radius:999px;font-size:11.5px;line-height:1.3}
.lb i{font-style:normal;font-weight:600;opacity:.7;margin-left:5px;font-size:10.5px}
.ex{position:absolute;right:6px;top:6px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.ex svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;fill:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
#modal .cred{font-size:9px;color:rgba(255,255,255,.5);pointer-events:none}
footer{position:fixed;right:calc(var(--sar) + 6px);bottom:calc(var(--sab) + 2px);z-index:6;font-size:8px;color:rgba(255,255,255,.45);text-shadow:0 1px 2px #000;pointer-events:none}footer a{pointer-events:auto}
body.tiny .lb{left:3px;top:3px;padding:2px 6px;font-size:9px}body.tiny .lb i{display:none}body.tiny .ex{display:none}.cam{cursor:pointer}

.tsw{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);pointer-events:none}.tsw>*{pointer-events:auto}

#ts{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;width:min(100%,420px);font-size:11px}
#ts input{flex:1;min-width:0;accent-color:#fff;height:18px;margin:0}
#tsl{flex:none;min-width:84px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lo{flex:none;font-style:normal;font-size:8px;opacity:.6;letter-spacing:.04em;white-space:nowrap}
body.tiny .cap{padding:0 5px 3px;gap:3px;font-size:9.5px}body.tiny .cap i,body.tiny .lo{display:none}body.tiny .cap .nm{letter-spacing:0}
footer a{color:rgba(255,255,255,.55)}

/* ---------- fullscreen viewer ---------- */
#modal{position:fixed;inset:0;z-index:20;display:none;touch-action:none;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#modal.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#modal{--cw:min(94vw,calc((100dvh - var(--sat) - var(--sab) - 64px) / (9/16 + 1)))}
@media (orientation:landscape) and (max-height:540px){#modal{--cw:min(94vw,calc((100dvh - var(--sat) - var(--sab) - 56px) * 16 / 9))}}
#card{position:relative;width:var(--cw);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0b0e16;
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);transform-origin:0 0;will-change:transform}
#mv{position:absolute;inset:0}
#modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mcap .cap{font-size:12px;padding:0 12px 8px}
.mtop{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px}
.pill{height:30px;display:flex;align-items:center;padding:0 11px;border-radius:999px;font:inherit;font-size:12px;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}
#mx{width:30px;padding:0;justify-content:center}
</style>
</head>
<body>

<header class="tabs">

</div>
</div>

<script>
const CAMS=[{"id": "gxcQJ8pJF0c", "name": "ふもとっぱら", "side": "南", "fuji": "見える", "top": true, "lat": 35.42, "lon": 138.579, "approx": false}, {"id": "GsD9QQEKSzQ", "name": "広重の富士山（さった峠）", "side": "南", "fuji": "見える（薄霞）", "top": true, "lat": 35.079, "lon": 138.556, "approx": false}, {"id": "bdUbACCWmoY", "name": "河口湖・大石公園", "side": "北", "fuji": "見える（薄霞）", "top": true, "lat": 35.526, "lon": 138.738, "approx": false}, {"id": "maMMEh-2Bsk", "name": "芦ノ湖（大観山）", "side": "東", "fuji": "見える", "top": true, "lat": 35.195, "lon": 139.075, "approx": false}, {"id": "1cnReFAU04k", "name": "河口湖畔", "side": "北", "fuji": "見える（裾に雲）", "top": false, "lat": 35.511, "lon": 138.757, "approx": false}, {"id": "F2NbYrc-gBU", "name": "山中湖畔", "side": "北", "fuji": "見える", "top": false, "lat": 35.41, "lon": 138.866, "approx": false}, {"id": "Joer2U0vki4", "name": "ぐりんぱ・二合目", "side": "南", "fuji": "見える", "top": false, "lat": 35.276, "lon": 138.77, "approx": false}, {"id": "rZckj5mmeXc", "name": "七面山 カメラ1", "side": "西", "fuji": "見える（薄霞）", "top": false, "lat": 35.37, "lon": 138.35, "approx": false}, {"id": "pPW9tqTL0BU", "name": "日本平", "side": "南", "fuji": "見える（薄霞）", "top": false, "lat": 34.97, "lon": 138.466, "approx": false}, {"id": "4Hro9QIrsYA", "name": "十国峠", "side": "東", "fuji": "見える", "top": false, "lat": 35.146, "lon": 139.048, "approx": false}, {"id": "_qdu714QT1E", "name": "本栖湖", "side": "北", "fuji": "見える", "top": false, "lat": 35.468, "lon": 138.59, "approx": false}, {"id": "ViHMZfmURiw", "name": "富士市 4K", "side": "南", "fuji": "見える", "top": false, "lat": 35.161, "lon": 138.676, "approx": true}, {"id": "so_3HK9HIdg", "name": "精進湖", "side": "北", "fuji": "見える", "top": false, "lat": 35.485, "lon": 138.617, "approx": false}, {"id": "_6nLps25Kws", "name": "FUJIYAMAタワー", "side": "北", "fuji": "見える（雲が多め）", "top": false, "lat": 35.487, "lon": 138.779, "approx": false}, {"id": "tuNC0ot0j9I", "name": "葉山海岸", "side": "東", "fuji": "霞で薄い", "top": false, "lat": 35.261, "lon": 139.574, "approx": false}, {"id": "MHEcWrKRKh8", "name": "神奈川から見る富士山", "side": "東", "fuji": "見える", "top": false, "lat": 35.45, "lon": 139.63, "approx": true}, {"id": "rBwmWq48zAs", "name": "御殿場", "side": "南", "fuji": "見える", "top": false, "lat": 35.308, "lon": 138.935, "approx": false}, {"id": "nl4UcsGSz-s", "name": "忠霊塔", "side": "北", "fuji": "見える", "top": false, "lat": 35.503, "lon": 138.801, "approx": false}, {"id": "WjVH-0qSwOw", "name": "山中湖・芙蓉台", "side": "北", "fuji": "見える", "top": false, "lat": 35.433, "lon": 138.858, "approx": false}, {"id": "OEPdIuE2ZpU", "name": "七面山 カメラ3", "side": "西", "fuji": "見える", "top": false, "lat": 35.37, "lon": 138.35, "approx": false}, {"id": "nh0TUmU-Sko", "name": "忍野しのびの里", "side": "北", "fuji": "山頂付近に雲", "top": false, "lat": 35.459, "lon": 138.853, "approx": false}];
const $=s=>document.querySelector(s);
const grid=$('#grid'),modal=$('#modal'),pager=$('#pager');
const phone=()=>Math.min(innerWidth,innerHeight)<600;
const embed=(id,x='')=>`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&cc_load_policy=0${x}`;
const ICON_EX='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';

document.querySelector('.tabs').style.setProperty('--tbg',`url(https://i.ytimg.com/vi/${CAMS[0].id}/hqdefault.jpg)`);
$('#bg').style.backgroundImage=`url(https://i.ytimg.com/vi/${CAMS[0].id}/hqdefault.jpg)`;

/* ---- chips ---- */
const sides=[['','すべて'],['北','北'],['南','南'],['東','東'],['西','西']];
const chips=$('#chips');const ind=document.createElement('span');ind.id='ind';
sides.forEach(([f,l])=>{const n=f?CAMS.filter(c=>c.side===f).length:CAMS.length;
  const b=document.createElement('button');b.className='chip';b.dataset.f=f;b.setAttribute('aria-pressed',f===''?'true':'false');
  b.innerHTML=`<span class="tl">${l}</span><small>${n}</small>`;b.onclick=()=>goPage(FS.indexOf(f));chips.appendChild(b);});chips.appendChild(ind);

/* ---- tiles: every cam streams continuously; iframes are added once and never removed or paused ---- */
const tiles=CAMS.map((c,i)=>{
  const d=document.createElement('div');d.className='cam'+(c.top?'':' rest');d.dataset.side=c.side;
  d.innerHTML=`<div class="v"><div class="shield"></div><div class="cap"><span class="nm">${c.name}<i>${c.side}</i></span><em class="lo" hidden>ライブのみ</em><b class="wx"></b></div></div>`;
  const t={c,el:d,v:d.querySelector('.v'),frame:null};d.setAttribute('role','button');d.setAttribute('aria-label',c.name+'を全画面');
  d.onclick=()=>openM(t);
  grid.appendChild(d);return t;});
const byEl=new Map(tiles.map(t=>[t.el,t]));
/* YouTube IFrame Player API: players are created once and never paused */
const PV={autoplay:1,mute:1,playsinline:1,controls:0,modestbranding:1,rel:0,iv_load_policy:3,disablekb:1,fs:0,cc_load_policy:0,enablejsapi:1,origin:location.origin};
let ytOK=false;const ytQ=[];
window.onYouTubeIframeAPIReady=()=>{ytOK=true;ytQ.splice(0).forEach(f=>f());};
{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);}
const whenYT=f=>ytOK?f():ytQ.push(f);
function mkPlayer(host,id,onReady){const d=document.createElement('div');host.prepend(d);
  return new Promise(res=>whenYT(()=>{const p=new YT.Player(d,{videoId:id,playerVars:PV,
    events:{onReady:e=>{try{e.target.mute();e.target.playVideo();}catch(_){}
      const f=e.target.getIframe();f.setAttribute('playsinline','');setTimeout(()=>f.classList.add('on'),400);f.tabIndex=-1;onReady&&onReady(e.target);res(p);}}});}));}
function load(t){if(t.frame)return;t.frame=1;
  mkPlayer(t.v,t.c.id,p=>{t.p=p;setTimeout(()=>seekP(p,t),1500);setTimeout(()=>seekP(p,t,1),8000);});}
/* time shift: offset in seconds back from each player's live edge (getDuration), clamped to its DVR window */

/* gapless cover layout: split n cams into r rows (counts as even as possible), every row spans the full width,
   so there is never empty space; choose r that minimises the average crop vs 16:9 */
function layout(n){
  n=n||1;const W=pager.clientWidth||innerWidth;
  const vh=window.visualViewport?visualViewport.height:innerHeight;
  const H=Math.max(100,vh-document.querySelector('header').offsetHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0));
  let best=null;
  for(let r=1;r<=n;r++){const base=Math.floor(n/r),extra=n%r,h=H/r;let crop=0;const rows=[];
    for(let i=0;i<r;i++){const k=base+(i<extra?1:0);if(!k){crop=1e9;break;}rows.push(k);
      const a=(W/k)/h/(16/9);crop+=k*Math.log(Math.max(a,1/a));}
    if(!best||crop<best.crop)best={crop,rows,h};}
  const rects=[];let y=0;
  best.rows.forEach(k=>{const w=W/k;for(let i=0;i<k;i++)rects.push({x:Math.round(i*w),y:Math.round(y),w:Math.round((i+1)*w)-Math.round(i*w),h:Math.round(y+best.h)-Math.round(y)});y+=best.h;});

const LORDER=['ja','en','zh-Hans','zh-Hant','ko','th','vi','id','es','fr','de','pt','it','ru','ar','hi'];
let LANG='ja';
function detect(){for(const l of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'])){const x=String(l).toLowerCase();
    if(x.startsWith('zh'))return /(tw|hk|mo|hant)/.test(x)?'zh-Hant':'zh-Hans';
    const b=x.split('-')[0];if(I18N[b])return b;}return 'en';}
const manual=()=>{try{return localStorage.getItem('lang')}catch(e){return null}};
const T=()=>I18N[LANG];
const tName=c=>(T().names[c.id]||c.name);
const SIDX={'北':1,'南':2,'東':3,'西':4};
const NOTO={th:'Noto+Sans+Thai',ar:'Noto+Sans+Arabic',hi:'Noto+Sans+Devanagari'};
function needFont(l){if(!NOTO[l]||document.getElementById('nf-'+l))return;const k=document.createElement('link');k.id='nf-'+l;k.rel='stylesheet';
  k.href=`https://fonts.googleapis.com/css2?family=${NOTO[l]}:wght@500;700&display=swap`;document.head.appendChild(k);}
function fitTabs(){chips.querySelectorAll('.chip').forEach(b=>{let f=13;b.style.fontSize=f+'px';const tl=b.querySelector('.tl');
  while(f>9&&tl.scrollWidth>tl.clientWidth+1){f-=.5;b.style.fontSize=f+'px';}});moveInd(true);}
function applyLang(l){LANG=I18N[l]?l:'en';const t=T(),rtl=LANG==='ar';needFont(LANG);
  document.documentElement.lang=LANG;document.title=t.title;
  const fam={th:'"Noto Sans Thai",',ar:'"Noto Sans Arabic",',hi:'"Noto Sans Devanagari",'}[LANG]||'';
  document.body.style.fontFamily=fam?`${fam}"Zen Kaku Gothic New",system-ui,sans-serif`:'';
  chips.querySelectorAll('.chip').forEach((b,i)=>{const s=b.querySelector('.tl');s.textContent=t.tabs[i];s.dir=rtl?'rtl':'auto';});
  tiles.forEach(x=>{const n=x.el.querySelector('.nm');n.dir=rtl?'rtl':'auto';n.firstChild.textContent=tName(x.c);n.querySelector('i').textContent=t.tabs[SIDX[x.c.side]]||x.c.side;});
  document.querySelectorAll('.cred').forEach(e=>{e.textContent=t.credit;e.dir=rtl?'rtl':'auto';});
  $('#lang').textContent=t.flag;$('#mapl').textContent='🗺 '+t.map;$('#mapn').textContent=t.approx;
  if(open){showMW();setMap(open.c);}
  fitTabs();buildLP();}
/* popup map: Leaflet + Esri World Imagery (keyless), lazy-loaded on first open; camera + summit + sight line */
const SUMMIT=[35.3606,138.7274];let LP=null,lmap=null,llayer=null;
function loadLeaflet(){if(LP)return LP;LP=new Promise((res,rej)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);
  const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});return LP;}
function setMap(c){if(c.lat==null){$('#mapw').hidden=true;return;}$('#mapw').hidden=false;
  $('#mapl').href=`https://www.google.com/maps/@?api=1&map_action=map&center=${c.lat},${c.lon}&zoom=11&basemap=satellite`;
  $('#mapn').hidden=!c.approx;
  loadLeaflet().then(()=>{if(open&&open.c!==c)return;
    if(!lmap){lmap=L.map('mapd',{zoomControl:true,attributionControl:true,maxZoom:17,zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:120,inertia:true,inertiaDeceleration:2000,easeLinearity:.25,bounceAtZoomLimits:false,tap:false,preferCanvas:true});
      lmap.on('movestart zoomstart',()=>modal.classList.add('nofx'));lmap.on('moveend zoomend',()=>modal.classList.remove('nofx'));
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,keepBuffer:4,updateWhenZooming:false,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(lmap);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,opacity:.85,keepBuffer:4,updateWhenZooming:false}).addTo(lmap);
      lmap.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');}
    if(llayer)llayer.remove();
    const cam=[c.lat,c.lon];
    llayer=L.layerGroup([
      L.polyline([cam,SUMMIT],{color:'#fff',weight:2,opacity:.85,dashArray:'6 6'}),
      L.marker(SUMMIT,{icon:L.divIcon({className:'',html:`<div class="sp"></div><span class="spl">${T().fuji}</span>`,iconSize:[16,16],iconAnchor:[8,8]})}),
      L.marker(cam,{icon:L.divIcon({className:'',html:'<div class="mk cam"></div>',iconSize:[14,14],iconAnchor:[7,7]})})]).addTo(lmap);
    lmap.invalidateSize();lmap.fitBounds(L.latLngBounds([cam,SUMMIT]),{padding:[60,60],maxZoom:12,animate:false});
  }).catch(()=>{$('#mapw').hidden=true;});}
/* keep map gestures inside the map */
/* map gestures: never stop propagation (Leaflet listens on document during drags); our own handlers ignore map targets instead */
const lp=$('#lp');
function buildLP(){const m=manual();lp.replaceChildren();
  const add=(code,label)=>{const b=document.createElement('button');b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(code===(m||'')));
    b.innerHTML=label;if(code==='ar')b.dir='rtl';b.onclick=e=>{e.stopPropagation();try{code?localStorage.setItem('lang',code):localStorage.removeItem('lang')}catch(_){}
      applyLang(code||detect());lp.hidden=true;};lp.appendChild(b);};
  add('',`⚙️ <span>${T().auto}</span>`);lp.appendChild(document.createElement('hr'));
  LORDER.forEach(k=>add(k,`<span>${I18N[k].flag}</span><span>${I18N[k].native}</span>`));}
$('#lang').onclick=e=>{e.stopPropagation();lp.hidden=!lp.hidden;};
document.addEventListener('click',e=>{if(!lp.hidden&&!e.target.closest('#lp,#lang'))lp.hidden=true;});
addEventListener('languagechange',()=>{if(!manual())applyLang(detect());});
applyLang(manual()||detect());
addEventListener('resize',fitTabs);

/* ---- weather (Open-Meteo, keyless, one batched request, every 10 min; fails silently) ---- */
const WX=new Map();
const wIcon=(c,d=1)=>c===0?(d?'☀️':'🌙'):c<=2?(d?'🌤️':'☁️🌙'):c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
function showMW(){if(open){const c=open.el.querySelector('.cap').cloneNode(true);$('#mcap').replaceChildren(c);}const w=open&&WX.get(open);$('#mw').textContent=w?`${wIcon(w.weather_code,w.is_day)} ${Math.round(w.temperature_2m)}° ☁${w.cloud_cover}% 低${w.cloud_cover_low}% 💨${Math.round(w.wind_speed_10m)}km/h`:'';}
async function wx(){try{
  const q=tiles.filter(t=>t.c.lat!=null);
  const u='https://api.open-meteo.com/v1/forecast?latitude='+q.map(t=>t.c.lat).join(',')+'&longitude='+q.map(t=>t.c.lon).join(',')+
    '&current=is_day,temperature_2m,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m&timezone=Asia%2FTokyo';
  const r=await fetch(u);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
  q.forEach((t,i)=>{const w=j[i]&&j[i].current;if(!w)return;WX.set(t,w);
    t.el.querySelector('.wx').textContent=`${wIcon(w.weather_code,w.is_day)} ${Math.round(w.temperature_2m)}°`;});
  showMW();
}catch(e){}}
wx();setInterval(wx,600000);
</script>
