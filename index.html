<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gap:6px;
  --glass-fill:rgba(255,255,255,.14);--glass-fill-on:rgba(255,255,255,.28);
  --glass-line:rgba(255,255,255,.42);--glass-line-on:rgba(255,255,255,.9);
  --glass-solid:rgba(28,32,44,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#05070d;-webkit-text-size-adjust:100%;height:auto;overflow-y:auto}
body{min-height:100dvh;color:#fff;font:500 13px/1.3 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;height:auto;overflow:visible;touch-action:manipulation}
/* soft blurred Fuji backdrop so the glass has something to read against */
#bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:#05070d center/cover no-repeat;filter:blur(28px) saturate(1.3) brightness(.55);transform:scale(1.15)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.25),rgba(5,7,13,.7))}

/* ---------- glass primitive: small pills only ---------- */
.glass{
  background:var(--glass-solid);
  border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);
  color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);
}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass-fill);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
  /* pills sitting on live video get a faint dark tint so white text stays legible on bright skies */
  .cam .glass,#modal .glass{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.10)),rgba(12,16,26,.30)}
}

/* ---------- top bar: transparent strip holding glass pills ---------- */
.tabs{touch-action:none;position:sticky;top:0;z-index:5;display:flex;align-items:stretch;isolation:isolate;overflow:hidden;padding:var(--sat) var(--sar) 0 var(--sal);
  background:transparent}
.tabs::before{display:none}
.tabs::after{display:none}
.tabs .title{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:17px;border-right:1px solid rgba(255,255,255,.08)}
.chips{position:relative;flex:1;min-width:0;display:flex;direction:ltr}
.lang{flex:none;width:44px;height:40px;border:0;margin:0;padding:0;background:transparent;opacity:.95;font-size:19px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tp{position:fixed;z-index:30;top:calc(var(--sat) + 44px);left:calc(var(--sal) + 6px);max-height:calc(100dvh - var(--sat) - 60px);overflow:auto;border-radius:14px;padding:4px;min-width:190px;background:rgba(14,18,28,.72)}
#tp button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;text-align:start;border-radius:10px;cursor:pointer}#tp button small{margin-inline-start:auto;opacity:.55;font-family:Inter,system-ui,sans-serif;font-size:11px}
#tp{position:fixed}#tp .tpc{position:absolute;left:4px;right:4px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);pointer-events:none;transition:top .22s cubic-bezier(.2,.8,.2,1)}#tp button{position:relative}#tp .tt{padding:6px 12px 4px;font-size:11px;opacity:.55}
#lp{position:fixed;z-index:30;top:calc(var(--sat) + 44px);right:calc(var(--sar) + 6px);max-height:calc(100dvh - var(--sat) - 60px);overflow:auto;border-radius:14px;padding:4px;min-width:190px;background:rgba(14,18,28,.72)}
#lp button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;text-align:start;border-radius:10px;cursor:pointer}
#lp button[aria-checked=true]{background:rgba(255,255,255,.12)}#lp hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:3px 6px}
.chip .tl{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#mapw{position:relative;width:var(--cw);aspect-ratio:1/1;touch-action:none;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#mapd{position:absolute;inset:0;background:#111}
#mapn,#mapl{z-index:500}
.leaflet-container{font:inherit;background:#111}
.sp{width:16px;height:16px;border-radius:50%;background:#ff5a1f;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.6)}
.spl{position:absolute;left:22px;top:-1px;white-space:nowrap;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000}
#modal.nofx{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.6)}
#mapd .leaflet-map-pane{will-change:transform}#mapd .leaflet-tile{will-change:transform;backface-visibility:hidden}
.mk.cam{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.3),0 1px 4px rgba(0,0,0,.6)}
.leaflet-control-zoom{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:rgba(14,18,28,.55)!important;color:#fff!important;border:0!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.leaflet-control-attribution{font-size:8px!important;background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.7)!important}.leaflet-control-attribution a{color:#fff!important}
#mapn{position:absolute;left:8px;bottom:8px;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}

@media (orientation:landscape) and (max-height:540px){#mapw{display:none}}
.chip{letter-spacing:.02em;flex:1;min-width:0;height:40px;padding:0;margin:0;border:0;border-radius:0;background:transparent;color:rgba(255,255,255,.65);font-weight:600;position:relative;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.chip .tl,.chip small{position:relative;z-index:1}
.chip[aria-pressed=true]{color:#fff;font-weight:700}
.chip small{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10px;opacity:.6;margin-left:3px;font-weight:500}
#ind{position:absolute;left:0;top:5px;bottom:5px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s;pointer-events:none}

/* ---------- grid ---------- */
#pager{position:relative;-webkit-mask-image:linear-gradient(transparent 0,#000 14px);mask-image:linear-gradient(transparent 0,#000 14px);overflow:hidden;touch-action:pan-y}html,body{overscroll-behavior:none;touch-action:pan-y;min-height:100dvh}
#ghost{position:absolute;left:0;top:0;width:100%;pointer-events:none;will-change:transform}
#ghost.tinyg .cap{padding:0 5px 3px;gap:3px;font-size:9.5px}#ghost.tinyg .cap i{display:none}
#grid{will-change:transform}
#grid{position:relative;overflow:hidden;width:100%}
.cam{position:absolute;overflow:hidden}
.cam .v{position:absolute;inset:0;overflow:hidden;background:#0b0e16;contain:layout paint}
.cam .v::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;z-index:4;pointer-events:none;background-color:rgb(var(--hz,255,255,255));-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.30) 0,rgba(0,0,0,.12) 8px,transparent 16px);mask-image:linear-gradient(to top,rgba(0,0,0,.30) 0,rgba(0,0,0,.12) 8px,transparent 16px);transition:background-color 1s}
.cam iframe{opacity:0;transition:opacity .8s ease}.cam iframe.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;height:35%;z-index:3;pointer-events:none;display:flex;align-items:flex-end;gap:5px;padding:0 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10.5px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.cap i{font-style:normal;font-weight:500;font-size:8.5px;opacity:.55;margin-left:5px;letter-spacing:.08em}
.cap b{flex:none;font-family:Inter,system-ui,sans-serif;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.92}.cap b:empty{display:none}
:root{--caph:0px}
.cam.hide{display:none}
.morewrap{display:flex;justify-content:center;padding:14px 0 6px}
body.expanded .morewrap,body.filtered .morewrap{display:none}
.more{height:48px;padding:0 24px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.cam iframe{position:absolute;left:50%;top:50%;border:0;width:calc(max(var(--w),var(--h)*16/9) + 2px);height:calc(max(var(--h),var(--w)*9/16) + 2px);transform:translate(-50%,-50%)}
.cam iframe{z-index:1;background:transparent;pointer-events:none}
.shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-y;transform:translateZ(0)}
#modal .shield{touch-action:none}
.lb{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;max-width:calc(100% - 72px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 10px;border-radius:999px;font-size:11.5px;line-height:1.3}
.lb i{font-style:normal;font-weight:600;opacity:.7;margin-left:5px;font-size:10.5px}
.ex{position:absolute;right:6px;top:6px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.ex svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;fill:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
#modal .cred{font-size:9px;color:rgba(255,255,255,.5);pointer-events:none}
footer{position:fixed;right:calc(var(--sar) + 6px);bottom:calc(var(--sab) + 2px);z-index:6;font-size:8px;color:rgba(255,255,255,.45);text-shadow:0 1px 2px #000;pointer-events:none}footer a{pointer-events:auto}
body.tiny .lb{left:3px;top:3px;padding:2px 6px;font-size:9px}body.tiny .lb i{display:none}body.tiny .ex{display:none}.cam{cursor:pointer}

.tsw{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);pointer-events:none}.tsw>*{pointer-events:auto}

#ts{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;width:min(100%,420px);font-size:11px}
#ts input{flex:1;min-width:0;accent-color:#fff;height:18px;margin:0}
#tsl{flex:none;min-width:84px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lo{flex:none;font-style:normal;font-size:8px;opacity:.6;letter-spacing:.04em;white-space:nowrap}
body.tiny .cap{padding:0 5px 3px;gap:3px;font-size:9.5px}body.tiny .cap i,body.tiny .lo{display:none}body.tiny .cap .nm{letter-spacing:0}
footer a{color:rgba(255,255,255,.55)}

/* ---------- fullscreen viewer ---------- */
#modal .glass{border:0;box-shadow:none}
#modal{position:fixed;inset:0;z-index:20;display:none;touch-action:none;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#modal.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#modal .glass{border:0!important;box-shadow:none!important}
#modal .cred{margin-top:8px}
#modal.open #card{border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (orientation:landscape) and (max-height:540px){#modal.open #card{border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55)}}#mapw{border-radius:0 0 18px 18px!important;box-shadow:0 24px 60px rgba(0,0,0,.45)!important}
#modal{--cw:min(94vw,calc((100dvh - var(--sat) - var(--sab) - 64px) / (9/16 + 1)))}
@media (orientation:landscape) and (max-height:540px){#modal{--cw:min(94vw,calc((100dvh - var(--sat) - var(--sab) - 56px) * 16 / 9))}}
#card{position:relative;width:var(--cw);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0b0e16;
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);transform-origin:0 0;will-change:transform}
#mv{position:absolute;inset:0;transform-origin:0 0;will-change:transform}#modal #mv iframe{pointer-events:none}
#modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mcap .cap{font-size:12px;padding:0 12px 8px}
.mtop{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px}
.pill{height:30px;display:flex;align-items:center;padding:0 11px;border-radius:999px;font:inherit;font-size:12px;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}
#mx{padding:0;justify-content:center}
.chips.many .chip small{display:none}.chips.many .chip{flex:1 1 auto;padding:0 2px}.chip .tl{white-space:nowrap}
.wx .lt{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;opacity:.85;margin-inline-start:2px}
#pwa{position:fixed;z-index:40;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:0 4px 0 14px;height:40px;border-radius:999px;background:rgba(14,18,28,.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:#fff;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}#pwa.on{opacity:1;pointer-events:auto}#pwa b{font-weight:700;cursor:pointer}#pwa button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.7);font-size:16px;cursor:pointer}

#home{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) calc(var(--sar) + 14px) calc(var(--sab) + 6px) calc(var(--sal) + 14px);background:radial-gradient(120% 60% at 50% 0%,#0d1a2e 0%,#05070d 70%);overflow:hidden;touch-action:pan-y;transition:opacity .28s ease}
#home.off{opacity:0;pointer-events:none}#home[hidden]{display:none}
#home .hb{display:flex;align-items:center;gap:10px;height:44px;flex:none}#home .hb img{width:30px;height:30px;border-radius:8px}
#home .hb h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.04em;flex:1}#home .hb button{height:34px;min-width:34px;border:0;border-radius:999px;background:rgba(120,190,255,.10);color:#fff;font-size:18px;cursor:pointer}
#home .tag{font-size:12px;color:rgba(200,225,255,.62);margin:0 0 10px;flex:none}
#home .hero{flex:none;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#0a1220}#home .hero iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#home .hcap{flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.72);margin:6px 2px 10px}#home .dot{width:7px;height:7px;border-radius:50%;background:#ff5f5f;flex:none}
#home .sec{font-size:11px;color:rgba(170,210,255,.6);margin:0 2px 6px;flex:none;letter-spacing:.06em}
#home .rec{display:flex;gap:8px;flex:none;margin-bottom:12px}
#home .rec button,#home .tg button{border:0;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(rgba(120,190,255,.11),rgba(120,190,255,.05));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#home .rec button{flex:1;display:flex;align-items:center;gap:7px;height:42px;padding:0 10px;border-radius:14px;font-size:12.5px;white-space:nowrap;overflow:hidden}#home .rec img{width:26px;height:26px;border-radius:7px;flex:none}
#home .tg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:7px;align-content:start;max-height:330px}
#home .tg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;padding:4px 2px;min-height:0;overflow:hidden}
#home .tg img{width:min(44px,62%);aspect-ratio:1;border-radius:11px}#home .tg b{font-size:11.5px;font-weight:700;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#home .tg small{font:500 10px Inter,sans-serif;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:4px}#home .tg small i{width:5px;height:5px;border-radius:50%;background:#ff5f5f}
#home .tg button.last{background:linear-gradient(rgba(120,200,255,.24),rgba(120,200,255,.10))}
#home footer{flex:none;display:flex;justify-content:center;gap:18px;font-size:10.5px;padding-top:8px}#home footer a{color:rgba(255,255,255,.42);text-decoration:none}
#tp .tt{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}#tp .thome{opacity:1;font-size:12px;color:#fff;padding:4px 10px;border-radius:999px;background:rgba(120,190,255,.14);cursor:pointer}

.dist{position:absolute;right:7px;top:6px;z-index:3;pointer-events:none;font:600 10.5px/1 Inter,"Zen Kaku Gothic New",sans-serif;color:#fff;letter-spacing:.01em;padding:3px 7px;border-radius:999px;background:rgba(10,14,24,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-shadow:0 1px 2px rgba(0,0,0,.6)}
body.tiny .dist{right:3px;top:3px;font-size:8.5px;padding:2px 5px}
body:not(.geo) .dist{display:none}
body:not(.geo) #mdist{display:none!important}
.dtog{cursor:pointer;opacity:1;font-size:12px;color:#fff;padding:4px 10px;border-radius:999px;background:rgba(120,190,255,.10)}

function toast(s){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=s;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),4200);}
{const _oM=openM;openM=function(x){const r=_oM.apply(this,arguments);try{const m=document.getElementById('mfx');m.hidden=true;if(x&&x.c.theme==='fuji'){if(FX)fxChip();else fxLoad().then(fxChip);}}catch(_){}return r;};if(open&&open.c.theme==='fuji')fxLoad().then(fxChip);setInterval(()=>{const m=document.getElementById('mfx');if(open&&open.c.theme==='fuji'&&m&&m.hidden){if(FX)fxChip();else if(!window.FXL){window.FXL=1;fxLoad().then(()=>{window.FXL=0;fxChip();});}}},2000);}
function nearGo(x){goTheme(x.c.theme);setTimeout(()=>{if(!open)openM(x);},380);}
function glLand(){if(GL.land||GL.lf)return;GL.lf=1;fetch('land.json').then(r=>r.json()).then(a=>{const D=Math.PI/1800;GL.land=a.map(l=>{const v=new Float32Array(l.length/2*3);for(let i=0,j=0;i<l.length;i+=2,j+=3){const lo=l[i]*D,la=l[i+1]*D,cf=Math.cos(la);v[j]=cf*Math.cos(lo);v[j+1]=cf*Math.sin(lo);v[j+2]=Math.sin(la);}return v;});glKick();}).catch(()=>{GL.lf=0});}
function glStart(){glLand();GL.s=null;GL.arcs=null;if(!GL.raf)GL.raf=requestAnimationFrame(glDraw);}
function renderHome(){if(HOMEEL.hidden)return;const t=T(),lt=lastTheme(),hero=CAMS.find(c=>c.id===HERO),sc=HOMEEL.scrollTop;
  const ifr=HOMEEL.querySelector('.hero iframe');
  const feats=[['LIVE','f1'],['GOLDEN','f8'],['FUJI','f9'],['SLEEP','f10'],['RANDOM','f11'],['TEMP','f2'],['MAP','f3'],['SORT','f4'],['SWIPE','f5'],['16 LANG','f6'],['APP','f7']];
  const gs=[['gl',t.c8,t.c8b],['tap',t.c9,t.c9b],['sx',t.c1,t.c1b],['v',t.c2,t.c2b],['rel',t.c3,''],['out',t.c4,''],['tap',t.c5,''],['pin',t.c6,''],['dn',t.c7,'']];
  HOMEEL.innerHTML=`<div class="stars"></div><div class="sf1"><div class="hb"><img src="icon-192.png" alt=""><h1>${t.hBrand||'ライブカメラ'}</h1><button id="hlang" aria-label="Language">${t.flag}</button></div>
  <p class="tag">${t.hTag}</p>
  <div class="globe"><canvas id="glb" aria-label="globe"></canvas><div id="glab" role="button"></div><div class="hc tl">◉ LIVE<b id="sfn">0</b></div><div class="hc tr">${t.sfClock}<b id="sfclk"></b></div><div class="hc bl" id="sfw"></div><div class="hc br" id="sfc"></div></div>
  <div class="hud"><div>${t.sfLive}<b class="cu" data-n="0" id="sfn2">0</b></div><div>${t.sfThemes}<b class="cu" data-n="${THEMES.filter(th=>th.id!=='mine').length}">0</b></div><div>${t.sfLangs}<b class="cu" data-n="16">0</b></div><div id="sfnr">${GEO.ok?`${t.sfNear}<b>—</b>`:`${t.sfNear}<button id="hgeo">📍 ${t.dOn}</button>`}</div></div>
  <div class="tick"><div>${sfClk()+sfClk()}</div></div><div class="hact"><button id="hrnd">🎲 ${t.rnd}</button><button id="hsl">🎞️ ${t.slT}</button></div>
  <div class="sec">${t.hRec}</div><div class="rec">${recIds().map(id=>`<button data-t="${id}"><img src="ti/${id}-192.png" alt=""><span>${tnm(id)}</span></button>`).join('')}</div>
  <div class="tg">${THEMES.filter(th=>th.id!=='mine').map(th=>`<button data-t="${th.id}" class="${th.id===lt?'last':''}"><img src="ti/${th.id}-192.png" alt=""><b>${tnm(th.id)}</b><small><i></i>${camCount(th.id)}</small></button>`).join('')}</div>
  <div class="scr">⌄ ${t.sfScroll}</div></div>
  <div class="sf2"><div class="sh">MY GLOBE</div><div class="sh2">⭐ ${t.mineSec}</div><div class="mine" id="mine">${mineHTML()}</div><div class="sh">WORLD EXTREMES</div><div class="xt" id="xt"></div><div class="sh">GOLDEN HOUR</div><div class="sh2">${t.gdT}</div><div class="gold" id="gold"></div><div class="sh">FUJI · ESTIMATE</div><div class="sh2">🗻 ${t.fxT}</div><div class="fxc" id="fxc"></div><button class="fxgo" id="fxgo">🗻 <span>${t.fxGo}</span><small>${camCount('fuji')}</small><i>›</i></button><div class="sh">LIVE FEED</div><div class="hero"></div><div class="hcap"><span class="dot"></span><span>${t.hFeat} · ${hero?tName(hero):''}</span></div>
  <div class="sh">FEATURES</div><div class="sh2">${t.sfFeatT}</div><div class="fc">${feats.map(([e,k],i)=>`<div><em>0${i+1} · ${e}</em><b>${t[k+'t']}</b><p>${t[k+'d']}</p></div>`).join('')}</div>
  <div class="sh" id="ctrl">CONTROLS</div><div class="sh2">${t.cT}</div><div class="gl">${gs.map(([k,a,b])=>`<div>${gd(k)}<div><b>${a}</b>${b?`<small>${b}</small>`:''}</div></div>`).join('')}</div>
  <button class="rp" id="tutr">↻ ${t.cReplay}</button>
  <footer><a href="about.html">${t.hAbout}</a><a href="https://earthdata.nasa.gov/gibs" target="_blank" rel="noopener">☁ NASA GIBS</a><a href="privacy.html">${t.hPriv}</a></footer></div>`;
  HOMEEL.dir=LANG==='ar'?'rtl':'auto';HOMEEL.scrollTop=sc;mineBind();{const go=e=>{e.stopPropagation();goTheme('fuji');};const b=HOMEEL.querySelector('#fxgo');if(b)b.onclick=go;const f=HOMEEL.querySelector('#fxc');if(f){f.style.cursor='pointer';f.onclick=go;}}
  const hv=HOMEEL.querySelector('.hero');if(ifr)hv.appendChild(ifr);else{const f=document.createElement('iframe');f.src=`https://www.youtube-nocookie.com/embed/${HERO}?autoplay=1&mute=1&playsinline=1&rel=0`;f.allow="autoplay; encrypted-media; picture-in-picture";f.referrerPolicy="strict-origin-when-cross-origin";f.title=hero?tName(hero):'live';f.loading='lazy';hv.appendChild(f);}
  HOMEEL.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>goTheme(b.dataset.t));
  HOMEEL.querySelector('#sfnr').onclick=e=>{e.stopPropagation();const s=sfStats();if(GEO.ok&&s.near)nearGo(s.near.x);else{window.NEARWANT=1;geoEnable();}};HOMEEL.querySelector('#hlang').onclick=e=>{e.stopPropagation();document.getElementById('lang').click();};
  HOMEEL.querySelector('#hrnd').onclick=e=>{e.stopPropagation();rndGo();};HOMEEL.querySelector('#hsl').onclick=e=>{e.stopPropagation();sleepOn();};HOMEEL.querySelector('#tutr').onclick=e=>{e.stopPropagation();tutShow(true);};
  const s=sfStats();HOMEEL.querySelector('#sfn2').dataset.n=s.live;const red=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
  const cu=[...HOMEEL.querySelectorAll('.cu')];(function st(n){const k=red?1:Math.min(1,(n-t0)/1400),e=1-Math.pow(1-k,3);cu.forEach(b=>b.textContent=Math.round(+b.dataset.n*e));if(k<1)requestAnimationFrame(st);})(t0);
  goldPaint();fxPaint();xtPaint();if(!XT)xtLoad().then(xtPaint);if(!FX)fxLoad().then(fxPaint);sfHud();sfLoop();GL.sel=null;glBind();glStart();}
/* tutorial */
const TUTS=[['sx','t1'],['edge','t2'],['v','t3'],['tap','t4']];let TI=0;window.TUTON=false;
try{window.TUTPEND=!localStorage.getItem('tutDone')&&!new URLSearchParams(location.search).has('cam');}catch(_){window.TUTPEND=false}
function tutPaint(){const el=document.getElementById('tut'),t=T();const[k,s]=TUTS[TI];el.dir=LANG==='ar'?'rtl':'auto';
  el.innerHTML=`<div class="st">GUIDE ${TI+1}/${TUTS.length}</div>${gd(k)}<p>${t[s]}</p><div class="dots">${TUTS.map((_,i)=>`<i class="${i===TI?'on':''}"></i>`).join('')}</div><div class="bt"><button id="tsk">${t.tSkip}</button><button class="pr" id="tnx">${TI<TUTS.length-1?t.tNext:t.tGo}</button></div>`;
  el.querySelector('#tsk').onclick=e=>{e.stopPropagation();tutHide();};el.querySelector('#tnx').onclick=e=>{e.stopPropagation();tutNext();};}
function tutNext(){if(TI<TUTS.length-1){TI++;tutPaint();}else tutHide();}
function tutShow(force){let el=document.getElementById('tut');if(!el){el=document.createElement('div');el.id='tut';el.setAttribute('role','dialog');el.hidden=true;document.body.appendChild(el);
  let x0=null,y0=0;el.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;const k=TUTS[TI][0],ax=Math.abs(dx),ay=Math.abs(dy);
    if(((k==='sx'||k==='edge')&&ax>50&&ax>ay)||(k==='v'&&ay>50&&ay>ax)||(k==='tap'&&ax<10&&ay<10))tutNext();},{passive:true});}
  if(!force&&(open||HOMEEL.hidden))return;TI=0;window.TUTON=true;tutPaint();el.hidden=false;requestAnimationFrame(()=>el.classList.add('on'));}
function tutHide(){const el=document.getElementById('tut');window.TUTON=false;window.TUTPEND=false;try{localStorage.setItem('tutDone','1')}catch(_){}if(!el)return;el.classList.remove('on');setTimeout(()=>{el.hidden=true},300);}
if(window.TUTPEND)setTimeout(()=>{if(!HOMEEL.hidden&&!open)tutShow();else window.TUTPEND=false;},1200);


function mineHTML(){const t=T(),list=[...FAV].map(id=>tiles.find(x=>x.c.id===id)).filter(Boolean);
  const tog=`<button class="mtog ${MINEONLY?'on':''}" id="mtog">${MINEONLY?t.mineOn:t.mineOff}</button>`;
  if(!list.length)return `<div class="memp">${tog}<p>${t.mineEmp}</p></div>`;
  return `<div class="mrow">${tog}</div><div class="mlst">${list.map(x=>{const w=WX.get(x);return `<button data-id="${x.c.id}"><b>${tName(x.c)}</b><span>${locTime(x)}${w?` · ${Math.round(w.temperature_2m)}°`:''}</span></button>`;}).join('')}</div>`;}
function mineBind(){const el=HOMEEL.querySelector('#mine');if(!el)return;const tg=el.querySelector('#mtog');if(tg)tg.onclick=e=>{e.stopPropagation();MINEONLY^=1;try{localStorage.setItem('mineOnly',MINEONLY)}catch(_){}renderHome();};
  el.querySelectorAll('.mlst button').forEach(b=>b.onclick=e=>{e.stopPropagation();const x=tiles.find(t=>t.c.id===b.dataset.id);if(x)homePop(x);});}
function showHome(){tiles.forEach(unload);HOMEEL.hidden=false;HOMEEL.classList.remove('off');renderHome();setTimeout(cldLoad,1500);}
function hideHome(){if(HOMEEL.hidden)return;HOMEEL.classList.add('off');const f=HOMEEL.querySelector('.hero iframe');f&&f.remove();setTimeout(()=>{HOMEEL.hidden=true;},280);}
/* swipe left on home -> last (or first) theme */
{let x0=null,y0=0;HOMEEL.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY;}},{passive:true});
 HOMEEL.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(dx<-70&&Math.abs(dx)>1.5*Math.abs(dy))goTheme(lastTheme()&&PG.some(p=>p.th===lastTheme())?lastTheme():THEMES[0].id);},{passive:true});}
if(window.HOME0)showHome();

gsAuto();

/* tap outside an open menu closes it (sort list first); the tap is consumed so nothing underneath reacts */
function menuFade(M){M.style.transition='opacity .2s ease';M.style.opacity='0';chips.querySelectorAll('.chip').forEach(c=>c.style.color='');setTimeout(()=>{M.hidden=true;M.style.cssText='';try{moveInd()}catch(_){}},200);}
addEventListener('click',e=>{const sp=document.getElementById('sp'),tg=e.target;
  if(tg.closest&&tg.closest('#gs,#pwa,#gload'))return;
  if(sp&&!sp.hidden&&sp.classList.contains('on')&&!tg.closest('#sp,.stog')){e.stopImmediatePropagation();e.preventDefault();spHide();return;}
  for(const M of [TPE,LPE]){if(M&&!M.hidden&&!M.contains(tg)&&!tg.closest('#thb,#lang,#sp')){e.stopImmediatePropagation();e.preventDefault();menuFade(M);return;}}},true);
